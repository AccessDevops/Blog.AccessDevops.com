<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#020817;overflow:hidden}
  .canvas{position:relative;width:512px;height:512px;overflow:hidden;background:#020817;
          display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif}
  .sq{width:384px;height:384px;border-radius:84px;background:#0B1220;border:1px solid rgba(248,250,252,.10);
      display:flex;align-items:center;justify-content:center;position:relative}
  .a{font-size:224px;font-weight:700;letter-spacing:-.06em;color:#F8FAFC;line-height:1;transform:translateY(-10px)}
  .bar{position:absolute;bottom:72px;left:50%;transform:translateX(-50%);width:88px;height:9px;border-radius:3px;background:#2563EB}
</style>
</head>
<body>
<div class="canvas"><div class="sq"><div class="a">A</div><div class="bar"></div></div></div>
</body>
</html>
