<svg xmlns="http://www.w3.org/2000/svg" width="940" height="500" viewBox="0 0 940 500" role="img" aria-labelledby="t d">
<title id="t">The same million small objects, priced across four storage classes</title>
<desc id="d">One million objects of 8,000 bytes, 7.45 GiB of real data, priced from the Amazon S3 offer file for us-east-1 published 25 November 2026. S3 Standard costs 0.17 dollars a month and Intelligent-Tiering the same, because objects under 128 KB are never tiered and carry no monitoring fee. Standard-IA bills the objects as 128 KB each, 122.07 GiB, so storage alone is 1.53 dollars, and one-off transition requests add 10.00 dollars for a first month of 11.53. One Zone-IA is 1.22 dollars of storage plus the same 10.00 of requests. Glacier Instant Retrieval is not drawn: 0.49 dollars of storage and 20.00 dollars of requests.</desc>
