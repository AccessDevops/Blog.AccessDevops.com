<text x="34" y="378" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#020817">Standard-IA bills 122.07 GiB for 7.45 GiB of data: the minimum-size charge alone is $1.43 a month.</text>
<text x="34" y="398" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#020817">Glacier Instant Retrieval, same objects: $0.49 of storage and $20.00 of transition requests.</text>
<text x="34" y="418" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#020817">Intelligent-Tiering is the same price as Standard here: below 128 KB there is no tier to move to.</text>
