<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 632" width="940" height="632" role="img" aria-label="One S3 object answering two questions: ListObjectsV2 matches the key prefix and returns no tags, while GetObject evaluates the s3:ExistingObjectTag condition before returning bytes">
  <style>
    .t { font-family: Inter, system-ui, -apple-system, sans-serif; }
    .h { font-size: 17px; font-weight: 600; fill: #020817; }
    .s { font-size: 12.5px; fill: #64748B; }
    .b { font-size: 13.5px; font-weight: 600; fill: #020817; }
    .d { font-size: 11.5px; fill: #64748B; }
    .n { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 11px; fill: #2563EB; }
    .k { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 12.5px; fill: #020817; }
    .m { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 12px; fill: #020817; }
  </style>

  <rect x="0.5" y="0.5" width="939" height="631" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>

  <text x="34" y="46" class="t h">One object, two questions</text>
  <text x="34" y="68" class="t s">A prefix decides what a listing shows. A tag decides whether one read is allowed.</text>

  <!-- object card -->
  <rect x="34" y="92" width="872" height="86" rx="7" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="52" y="120" class="k">s3://acme-docs/invoices/acme/2026/INV-1042.pdf</text>
  <text x="52" y="144" class="t d">prefixes it matches: <tspan class="n">invoices/acme/2026/</tspan></text>
  <text x="52" y="164" class="t d">tags stored with it: <tspan class="n">tenant=acme</tspan></text>

  <!-- arrows -->
  <line x1="244" y1="178" x2="244" y2="204" stroke="#E2E8F0" stroke-width="1"/>
  <polygon points="244,208 240.5,201 247.5,201" fill="#64748B"/>
  <line x1="696" y1="178" x2="696" y2="204" stroke="#E2E8F0" stroke-width="1"/>
  <polygon points="696,208 692.5,201 699.5,201" fill="#64748B"/>

  <!-- left: listing -->
  <rect x="34" y="208" width="420" height="196" rx="7" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="52" y="234" class="t b">ListObjectsV2 asks about the prefix</text>
  <text x="52" y="258" class="n">list-objects-v2 --prefix invoices/acme/2026/</text>
  <text x="52" y="284" class="t d">returns Key, Size, ETag, StorageClass</text>
  <text x="52" y="304" class="t d">no tag field in the response</text>
  <text x="52" y="324" class="t d">no request parameter to filter on a tag</text>
  <rect x="52" y="342" width="384" height="46" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="66" y="362" class="t d">policy lever: <tspan class="n">s3:ListBucket</tspan> + <tspan class="n">s3:prefix</tspan></text>
  <text x="66" y="379" class="t d">every key name under the prefix stays visible</text>

  <!-- right: read -->
  <rect x="486" y="208" width="420" height="196" rx="7" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="504" y="234" class="t b">GetObject asks about the object</text>
  <text x="504" y="258" class="n">get-object INV-1042.pdf</text>
  <text x="504" y="284" class="t d">S3 reads the tag set stored with the object</text>
  <text x="504" y="304" class="t d">condition on <tspan class="n">s3:ExistingObjectTag/tenant</tspan></text>
  <text x="504" y="324" class="t d">decision taken before a byte is sent</text>
  <rect x="504" y="342" width="384" height="46" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="518" y="362" class="t d">policy lever: <tspan class="n">s3:ExistingObjectTag/&lt;key&gt;</tspan></text>
  <text x="518" y="379" class="t d">bytes returned, or 403 AccessDenied</text>

  <!-- statement -->
  <rect x="34" y="430" width="872" height="84" rx="7" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="52" y="456" class="t b">One statement covers every tenant</text>
  <text x="52" y="480" class="m">"s3:ExistingObjectTag/tenant": "${aws:PrincipalTag/tenant}"</text>
  <text x="52" y="500" class="t d">The value comes from the caller's identity tag, so the policy stays the same size at 10 tenants or 10 000.</text>

  <!-- limits -->
  <rect x="34" y="536" width="872" height="64" rx="7" fill="#FFFFFF" stroke="#E2E8F0" stroke-dasharray="4 3"/>
  <text x="52" y="562" class="t b">What a tag cannot do</text>
  <text x="52" y="584" class="t d">PutObject and DeleteObject: <tspan class="n">s3:ExistingObjectTag</tspan> is not supported, so deletion control stays with the prefix or Object Lock.</text>
</svg>
