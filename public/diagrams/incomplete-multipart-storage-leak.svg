<svg xmlns="http://www.w3.org/2000/svg" width="940" height="530" viewBox="0 0 940 530" role="img" aria-labelledby="t d">
<title id="t">Orphaned multipart parts accumulate with every failed upload until something aborts them</title>
<desc id="d">Cumulative storage held by incomplete multipart uploads from one 40 GB nightly dump that dies at 85 percent, leaving 34 GB of parts each night. Without a lifecycle rule the line climbs 34 GB a night to 1,020 GB after 30 nights, billed at 0.023 dollars per gigabyte-month, about 23.46 dollars a month and still rising. With an AbortIncompleteMultipartUpload rule at one day, only the two most recent nights sit on the bill, 68 GB, about 1.56 dollars. No object exists in either case: ListObjectsV2 returns zero keys while the parts are stored.</desc>
<rect width="940" height="530" fill="#FFFFFF"/>
<text x="34" y="46" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600" letter-spacing="-0.02em" fill="#020817">One failed job a night, an accidental archive in a month</text>
<text x="34" y="70" font-family="Inter, system-ui, sans-serif" font-size="12.5" fill="#64748B">Orphaned parts from a 40 GB dump that dies at 85%, priced at $0.023/GB-month (S3 Standard, us-east-1, 2026-11-21)</text>
