<text x="850" y="374.2" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#64748B">AbortIncompleteMultipartUpload, DaysAfterInitiation=1: two nights at most</text>
<rect x="104" y="116" width="756" height="288" fill="none" stroke="#E2E8F0"/>
<text x="120" y="140" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#64748B">ListObjectsV2 on this bucket: 0 keys, every day of the month</text>
<line x1="34" y1="452" x2="58" y2="452" stroke="#2563EB" stroke-width="2.5"/>
<text x="66" y="456" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#020817">parts kept because nothing completes or aborts the upload</text>
<line x1="470" y1="452" x2="494" y2="452" stroke="#020817" stroke-width="2" stroke-dasharray="6 4"/>
<text x="502" y="456" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#020817">the same uploads after the abort rule fires</text>
<text x="34" y="492" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#64748B">Measured on SeaweedFS 4.50: three 5 MiB parts left 15,728,640 bytes while ListObjectsV2 reported zero keys, and a refused completion left 1,049,600 more.</text>
</svg>
