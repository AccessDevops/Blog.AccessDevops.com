<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 620" width="940" height="620" role="img" aria-label="Role chaining: an IAM user assumes RoleA and may request up to 43200 seconds, but when the RoleA session assumes RoleB the request for 43200 is refused and only 3600 seconds are granted, so a six-hour job dies at the one-hour mark with 400 ExpiredToken">
  <style>
    .t { font-family: Inter, system-ui, -apple-system, sans-serif; }
    .h { font-size: 17px; font-weight: 600; fill: #020817; }
    .s { font-size: 12.5px; fill: #64748B; }
    .l { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 10.5px; letter-spacing: 0.06em; fill: #64748B; }
    .b { font-size: 13px; font-weight: 600; fill: #020817; }
    .d { font-size: 11.5px; fill: #64748B; }
    .n { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 11.5px; fill: #020817; }
    .e { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 10.5px; fill: #B42318; }
    .r { font-size: 11.5px; fill: #B42318; }
  </style>

  <rect x="0.5" y="0.5" width="939" height="619" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>

  <text x="34" y="46" class="t h">The second hop drops the ceiling to 3600 seconds</text>
  <text x="34" y="68" class="t s">DurationSeconds is a request, capped by the role — except when the caller is already a role session.</text>

  <!-- left: the ladder -->
  <rect x="34.5" y="95.5" width="319" height="93" rx="7" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="50" y="119" class="t l">STEP 1 · LONG-TERM KEY</text>
  <text x="50" y="141" class="t b">IAM user</text>
  <text x="50" y="161" class="t d">MaxSessionDuration applies: up to 43200 s</text>
  <text x="50" y="181" class="t d">no session clock of its own</text>

  <line x1="194" y1="188" x2="194" y2="204" stroke="#64748B" stroke-width="1"/>
  <polygon points="194,207 190.5,200 197.5,200" fill="#64748B"/>
  <text x="210" y="200" class="t n">sts:AssumeRole</text>

  <rect x="34.5" y="207.5" width="319" height="93" rx="7" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="50" y="231" class="t l">STEP 2 · INITIAL ASSUMPTION</text>
  <text x="50" y="253" class="t b">RoleA session</text>
  <text x="50" y="273" class="t d">43200 accepted → 12-hour session</text>
  <text x="50" y="293" class="t d">one token, one expiry written on it</text>

  <line x1="194" y1="300" x2="194" y2="316" stroke="#64748B" stroke-width="1"/>
  <polygon points="194,319 190.5,312 197.5,312" fill="#64748B"/>
  <text x="210" y="312" class="t n">sts:AssumeRole</text>

  <rect x="34.5" y="319.5" width="319" height="93" rx="7" fill="#F8FAFC" stroke="#2563EB"/>
  <text x="50" y="343" class="t l">STEP 3 · ROLE CHAINING</text>
  <text x="50" y="365" class="t b">RoleB session</text>
  <text x="50" y="385" class="t d">43200 refused, 3600 granted</text>
  <text x="50" y="405" class="t e">ValidationError · 1-hour cap</text>

  <!-- right: what sets the ceiling -->
  <rect x="566.5" y="95.5" width="339" height="317" rx="7" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="582" y="129" class="t b">What sets the ceiling</text>

  <text x="582" y="165" class="t d">user → role</text>
  <text x="770" y="165" class="t n">43200 s max</text>
  <text x="582" y="195" class="t d">role → role</text>
  <text x="770" y="195" class="t n">3600 s max</text>
  <text x="582" y="225" class="t d">compute role</text>
  <text x="770" y="225" class="t n">refreshed</text>

  <line x1="582" y1="245" x2="890" y2="245" stroke="#E2E8F0"/>

  <text x="582" y="269" class="t d">A chained call ignores the role's</text>
  <text x="582" y="287" class="t d">own MaxSessionDuration. No policy</text>
  <text x="582" y="305" class="t d">raises it.</text>

  <text x="582" y="335" class="t l">THE ARN DOES NOT SHOW DEPTH</text>
  <text x="582" y="357" class="t n">assumed-role/RoleB/run-42</text>
  <text x="582" y="379" class="t d">Same shape at any hop count:</text>
  <text x="582" y="397" class="t d">only Expiration tells the truth.</text>

  <!-- bottom: the timeline -->
  <text x="34" y="462" class="t l">THE SIX-HOUR JOB</text>

  <rect x="80" y="494" width="137.7" height="18" fill="#2563EB"/>
  <rect x="217.7" y="494" width="688.3" height="18" fill="none" stroke="#64748B" stroke-width="1" stroke-dasharray="4 3"/>

  <line x1="80" y1="528" x2="906" y2="528" stroke="#020817" stroke-width="1"/>
  <line x1="80" y1="521" x2="80" y2="535" stroke="#020817" stroke-width="1"/>
  <line x1="217.7" y1="521" x2="217.7" y2="535" stroke="#020817" stroke-width="1"/>
  <line x1="355.3" y1="521" x2="355.3" y2="535" stroke="#020817" stroke-width="1"/>
  <line x1="493" y1="521" x2="493" y2="535" stroke="#020817" stroke-width="1"/>
  <line x1="630.7" y1="521" x2="630.7" y2="535" stroke="#020817" stroke-width="1"/>
  <line x1="768.3" y1="521" x2="768.3" y2="535" stroke="#020817" stroke-width="1"/>
  <line x1="906" y1="521" x2="906" y2="535" stroke="#020817" stroke-width="1"/>

  <text x="80" y="553" class="t d" text-anchor="middle">0 h</text>
  <text x="217.7" y="553" class="t d" text-anchor="middle">1 h</text>
  <text x="355.3" y="553" class="t d" text-anchor="middle">2 h</text>
  <text x="493" y="553" class="t d" text-anchor="middle">3 h</text>
  <text x="630.7" y="553" class="t d" text-anchor="middle">4 h</text>
  <text x="768.3" y="553" class="t d" text-anchor="middle">5 h</text>
  <text x="906" y="553" class="t d" text-anchor="middle">6 h</text>

  <line x1="217.7" y1="476" x2="217.7" y2="538" stroke="#B42318" stroke-width="2"/>
  <text x="224" y="472" class="t r">400 ExpiredToken</text>
  <text x="890" y="484" class="t d" text-anchor="end">scheduled work that never runs</text>

  <text x="34" y="590" class="t d">Five hours of schedule gone, and the parts already uploaded keep billing until a lifecycle rule aborts them.</text>
</svg>
