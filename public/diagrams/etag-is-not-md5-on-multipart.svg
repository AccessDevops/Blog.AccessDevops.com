<svg xmlns="http://www.w3.org/2000/svg" width="940" height="596" viewBox="0 0 940 596" role="img" aria-labelledby="t d">
  <title id="t">The same 20 MiB file uploaded three ways produces three different ETags</title>
  <desc id="d">One PUT returns the MD5 of the file. A two-part and a four-part multipart upload of identical bytes return a hash of the part hashes with a dash and the part count appended, so neither equals the file MD5. A bottom band gives the composite rule and the measured case where a server-side copy kept the composite ETag instead of reverting to an MD5.</desc>

  <rect x="0" y="0" width="940" height="596" fill="#FFFFFF"/>
  <text x="24" y="40" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#020817">Same file, 20 MiB, MD5 4ffc00e6…6a392c98</text>
  <text x="24" y="62" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#64748B">Three upload paths, three ETags. The object never changed.</text>

  <text x="164" y="90" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#020817">One PUT</text>
  <rect x="24" y="104" width="280" height="154" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="40" y="185" text-anchor="start" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#64748B">part 1 — 20 MiB</text>
  <line x1="164" y1="262" x2="164" y2="280" stroke="#2563EB" stroke-width="1"/>
  <path d="M160 278 L164 286 L168 278 Z" fill="#2563EB"/>
  <rect x="24" y="290" width="280" height="60" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="40" y="310" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#64748B" letter-spacing="0.06em">ETAG</text>
  <text x="40" y="334" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#020817">4ffc00e6e0d625f936b806a86a392c98</text>
  <text x="164" y="376" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#2563EB">= MD5 of the file</text>

  <text x="470" y="90" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#020817">Multipart, 2 parts</text>
  <rect x="330" y="104" width="280" height="74" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="346" y="145" text-anchor="start" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#64748B">1 — 10 MiB</text>
  <rect x="330" y="184" width="280" height="74" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="346" y="225" text-anchor="start" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#64748B">2 — 10 MiB</text>
  <line x1="470" y1="262" x2="470" y2="280" stroke="#2563EB" stroke-width="1"/>
  <path d="M466 278 L470 286 L474 278 Z" fill="#2563EB"/>
  <rect x="330" y="290" width="280" height="60" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="346" y="310" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#64748B" letter-spacing="0.06em">ETAG</text>
  <text x="346" y="334" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#020817">fbad3182280f8de3b9cb78094f2fb990-2</text>
  <text x="470" y="376" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#020817">≠ MD5 of the file</text>

  <text x="776" y="90" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#020817">Multipart, 4 parts</text>
  <rect x="636" y="104" width="280" height="34" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="652" y="125" text-anchor="start" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#64748B">1 — 5 MiB</text>
  <rect x="636" y="144" width="280" height="34" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="652" y="165" text-anchor="start" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#64748B">2 — 5 MiB</text>
  <rect x="636" y="184" width="280" height="34" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="652" y="205" text-anchor="start" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#64748B">3 — 5 MiB</text>
  <rect x="636" y="224" width="280" height="34" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="652" y="245" text-anchor="start" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#64748B">4 — 5 MiB</text>
  <line x1="776" y1="262" x2="776" y2="280" stroke="#2563EB" stroke-width="1"/>
  <path d="M772 278 L776 286 L780 278 Z" fill="#2563EB"/>
  <rect x="636" y="290" width="280" height="60" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="652" y="310" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#64748B" letter-spacing="0.06em">ETAG</text>
  <text x="652" y="334" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#020817">c87fa7c13b8a90030bbaa9fe45870eb2-4</text>
  <text x="776" y="376" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#020817">≠ MD5 of the file</text>

  <line x1="24" y1="404" x2="916" y2="404" stroke="#E2E8F0" stroke-width="1"/>
  <text x="24" y="432" font-family="Inter, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#020817">The ETag identifies the upload, not the bytes</text>
  <text x="24" y="456" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#64748B">Single part, plaintext or SSE-S3:</text>
  <text x="210" y="456" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#020817">ETag = MD5(bytes)</text>
  <text x="24" y="478" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#64748B">Any multipart upload:</text>
  <text x="210" y="478" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#2563EB">ETag = MD5(MD5(p1)..MD5(pn)) + "-n"</text>

  <rect x="24" y="500" width="892" height="76" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="40" y="522" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#020817">Measured 18 November 2026, SeaweedFS 4.50</text>
  <text x="40" y="544" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#64748B">A server-side copy of the 4-part object came back as c87fa7c1…-4, not as an MD5 — AWS documents a copy</text>
  <text x="40" y="562" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#64748B">of a plaintext object as an MD5. Two implementations of one API, two answers to the same question.</text>
</svg>
