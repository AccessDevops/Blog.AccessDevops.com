<svg xmlns="http://www.w3.org/2000/svg" width="940" height="620" viewBox="0 0 940 620" role="img" aria-labelledby="t d">
  <title id="t">Where a CRC64NVME checksum is computed, signed, checked and stored</title>
  <desc id="d">Four steps: the client computes the checksum, SigV4 signs the header, the server recomputes and compares it before storing, and a read returns it only when checksum mode is enabled. A bottom band shows three defaults that disagree: the CLI sends CRC64NVME, the SDKs send CRC32, and a client that sends nothing gets CRC64NVME stored for it.</desc>

  <rect x="0" y="0" width="940" height="620" fill="#FFFFFF"/>

  <line x1="276" y1="56" x2="276" y2="440" stroke="#E2E8F0" stroke-width="1"/>

  <!-- step 1 -->
  <rect x="24" y="64" width="228" height="72" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="40" y="92" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#020817">PutObject, at the client</text>
  <text x="40" y="112" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#64748B">CRC computed over the bytes</text>
  <text x="40" y="128" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#64748B">before a single byte is sent</text>
  <line x1="138" y1="136" x2="138" y2="160" stroke="#2563EB" stroke-width="1"/>
  <path d="M133 156 L138 164 L143 156 Z" fill="#2563EB"/>

  <!-- step 2 -->
  <rect x="24" y="168" width="228" height="72" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="40" y="196" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#020817">Signature V4</text>
  <text x="40" y="216" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#64748B">the header joins SignedHeaders,</text>
  <text x="40" y="232" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#64748B">so a proxy cannot rewrite it</text>
  <line x1="138" y1="240" x2="138" y2="264" stroke="#2563EB" stroke-width="1"/>
  <path d="M133 260 L138 268 L143 260 Z" fill="#2563EB"/>

  <!-- step 3 -->
  <rect x="24" y="272" width="228" height="72" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="40" y="300" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#020817">Recompute, then compare</text>
  <text x="40" y="320" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#64748B">equal: object stored with</text>
  <text x="40" y="336" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#64748B">its checksum in metadata</text>
  <line x1="138" y1="344" x2="138" y2="368" stroke="#2563EB" stroke-width="1"/>
  <path d="M133 364 L138 372 L143 364 Z" fill="#2563EB"/>

  <!-- step 4 -->
  <rect x="24" y="376" width="228" height="72" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="40" y="404" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#020817">HeadObject / GetObject</text>
  <text x="40" y="424" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#64748B">returns the stored value,</text>
  <text x="40" y="440" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#64748B">if you asked for it</text>

  <!-- annotation 1 -->
  <text x="300" y="88" font-family="Inter, system-ui, sans-serif" font-size="12.5" fill="#020817">The algorithm is chosen here, not by S3.</text>
  <text x="300" y="108" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#2563EB">x-amz-checksum-crc32</text>
  <text x="300" y="126" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#64748B">is what boto3 1.43 sends unless told otherwise.</text>

  <!-- annotation 2 -->
  <text x="300" y="192" font-family="Inter, system-ui, sans-serif" font-size="12.5" fill="#020817">Signed, therefore not editable.</text>
  <text x="300" y="212" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#64748B">A header changed after signing answers</text>
  <text x="300" y="230" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#020817">SignatureDoesNotMatch</text>
  <text x="300" y="248" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#64748B">before any checksum is looked at.</text>

  <!-- annotation 3 -->
  <rect x="300" y="286" width="616" height="52" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="316" y="306" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#020817">400 BadDigest</text>
  <text x="316" y="326" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#64748B">The Content-MD5 you specified did not match what we received.</text>
  <text x="300" y="356" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#64748B">The message names MD5 whatever the algorithm was.</text>

  <!-- annotation 4 -->
  <text x="300" y="400" font-family="Inter, system-ui, sans-serif" font-size="12.5" fill="#020817">Off by default.</text>
  <text x="300" y="420" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#020817">x-amz-checksum-mode: ENABLED</text>
  <text x="300" y="440" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#64748B">Without it the response carries no checksum at all.</text>

  <!-- bottom band: three defaults -->
  <line x1="24" y1="474" x2="916" y2="474" stroke="#E2E8F0" stroke-width="1"/>
  <text x="24" y="502" font-family="Inter, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#020817">Three defaults that disagree, 9 November 2026</text>

  <rect x="24" y="516" width="286" height="66" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="40" y="540" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#020817">AWS CLI v2 sends</text>
  <text x="40" y="562" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#2563EB">CRC64NVME</text>

  <rect x="327" y="516" width="286" height="66" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="343" y="540" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#020817">boto3, Go, Java, JS send</text>
  <text x="343" y="562" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#2563EB">CRC32</text>

  <rect x="630" y="516" width="286" height="66" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="646" y="540" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#020817">No checksum sent: S3 stores</text>
  <text x="646" y="562" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#2563EB">CRC64NVME</text>
</svg>
