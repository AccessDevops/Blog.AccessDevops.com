<svg xmlns="http://www.w3.org/2000/svg" width="940" height="680" viewBox="0 0 940 680" role="img" aria-label="A multipart upload survives the process that started it: the upload id and the part ETags are still on the server after a crash, so the restart lists the upload, lists its parts and sends only the missing one — unless the part list returns a stale ETag for a re-sent part number">
<rect x="0" y="0" width="940" height="680" fill="#FFFFFF" stroke="none"/>
<text x="40" y="40" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#64748B" font-weight="400" text-anchor="start">PUT /db.tar?uploads  →  POST ?partNumber=1,2  →  process exits</text>
<text x="40" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#64748B" font-weight="400" text-anchor="start">the upload id and the parts live on the server, not in your state file</text>
<rect x="40" y="76" width="250" height="104" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
<text x="58" y="100" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#020817" font-weight="600" text-anchor="start">CreateMultipartUpload</text>
<text x="58" y="122" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#64748B" font-weight="400" text-anchor="start">uploadId 1c1651d2…</text>
<text x="58" y="140" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#64748B" font-weight="400" text-anchor="start">no expiry server-side</text>
<text x="58" y="158" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#64748B" font-weight="400" text-anchor="start">complete or abort, or it stays</text>
<line x1="292" y1="128" x2="345" y2="128" stroke="#E2E8F0" stroke-width="1"/>
<path d="M345 124 L352 128 L345 132 Z" fill="#E2E8F0"/>
<rect x="352" y="76" width="250" height="104" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
<text x="370" y="100" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#020817" font-weight="600" text-anchor="start">UploadPart 1 and 2</text>
<text x="370" y="122" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#64748B" font-weight="400" text-anchor="start">200 · ETag b325f8…</text>
<text x="370" y="140" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#64748B" font-weight="400" text-anchor="start">200 · ETag ac9271…</text>
<text x="370" y="158" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#64748B" font-weight="400" text-anchor="start">5 242 880 bytes each</text>
<line x1="604" y1="128" x2="657" y2="128" stroke="#E2E8F0" stroke-width="1"/>
<path d="M657 124 L664 128 L657 132 Z" fill="#E2E8F0"/>
<rect x="664" y="76" width="236" height="104" rx="10" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
<text x="682" y="100" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#020817" font-weight="600" text-anchor="start">The uploader dies</text>
<text x="682" y="122" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#64748B" font-weight="400" text-anchor="start">ETags are in a temp file</text>
<text x="682" y="140" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#64748B" font-weight="400" text-anchor="start">the temp file is not</text>
<text x="682" y="158" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#020817" font-weight="600" text-anchor="start">nothing is lost yet</text>
<line x1="40" y1="204" x2="900" y2="204" stroke="#E2E8F0" stroke-width="1"/>
<text x="40" y="230" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#020817" font-weight="600" text-anchor="start">After the restart — three calls, no state file</text>
<rect x="40" y="258" width="604" height="48" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
<text x="60" y="279" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#020817" font-weight="600" text-anchor="start">ListMultipartUploads</text>
<text x="60" y="296" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#64748B" font-weight="400" text-anchor="start">1 in-progress upload for db.tar · IsTruncated false</text>
<line x1="646" y1="282" x2="673" y2="282" stroke="#E2E8F0" stroke-width="1"/>
<path d="M673 278 L680 282 L673 286 Z" fill="#E2E8F0"/>
<rect x="40" y="320" width="604" height="48" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
<text x="60" y="341" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#020817" font-weight="600" text-anchor="start">ListParts</text>
<text x="60" y="358" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#64748B" font-weight="400" text-anchor="start">2 parts · each with its PartNumber, Size and ETag</text>
<line x1="646" y1="344" x2="673" y2="344" stroke="#E2E8F0" stroke-width="1"/>
<path d="M673 340 L680 344 L673 348 Z" fill="#E2E8F0"/>
<rect x="40" y="382" width="604" height="48" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
<text x="60" y="403" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#020817" font-weight="600" text-anchor="start">UploadPart 3</text>
<text x="60" y="420" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#64748B" font-weight="400" text-anchor="start">the only missing part is re-sent · last part, 1 024 bytes</text>
<line x1="646" y1="406" x2="673" y2="406" stroke="#E2E8F0" stroke-width="1"/>
<path d="M673 402 L680 406 L673 410 Z" fill="#E2E8F0"/>
<rect x="40" y="444" width="604" height="48" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
<text x="60" y="465" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#020817" font-weight="600" text-anchor="start">CompleteMultipartUpload</text>
<text x="60" y="482" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#64748B" font-weight="400" text-anchor="start">the parts list rebuilt from ListParts · 200 · 10 486 784 bytes</text>
<line x1="646" y1="468" x2="673" y2="468" stroke="#E2E8F0" stroke-width="1"/>
<path d="M673 464 L680 468 L673 472 Z" fill="#E2E8F0"/>
<rect x="684" y="258" width="216" height="234" rx="10" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
<text x="702" y="282" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#020817" font-weight="600" text-anchor="start">Why it works</text>
<text x="702" y="306" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#64748B" font-weight="400" text-anchor="start">the server kept the</text>
<text x="702" y="322" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#64748B" font-weight="400" text-anchor="start">upload id alive, so</text>
<text x="702" y="338" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#64748B" font-weight="400" text-anchor="start">the resume needs the</text>
<text x="702" y="354" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#64748B" font-weight="400" text-anchor="start">endpoint, the bucket,</text>
<text x="702" y="370" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#64748B" font-weight="400" text-anchor="start">the key and the id —</text>
<text x="702" y="386" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#64748B" font-weight="400" text-anchor="start">not disk on the host</text>
<text x="702" y="414" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.8" fill="#020817" font-weight="400" text-anchor="start">s3:ListMultipartUploadParts</text>
<text x="702" y="432" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.8" fill="#020817" font-weight="400" text-anchor="start">s3:ListBucketMultipartUploads</text>
<text x="702" y="460" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#64748B" font-weight="400" text-anchor="start">the two permissions a</text>
<text x="702" y="476" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#64748B" font-weight="400" text-anchor="start">resume actually needs</text>
<line x1="40" y1="520" x2="900" y2="520" stroke="#E2E8F0" stroke-width="1"/>
<text x="40" y="546" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#020817" font-weight="600" text-anchor="start">The part list is not always the truth — re-sending a part number</text>
<rect x="40" y="558" width="424" height="60" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
<text x="58" y="580" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#020817" font-weight="600" text-anchor="start">UploadPart 2 again → 200 with a new ETag</text>
<text x="58" y="600" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#64748B" font-weight="400" text-anchor="start">the part list should now show that new ETag</text>
<rect x="476" y="558" width="424" height="60" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
<text x="494" y="580" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#020817" font-weight="600" text-anchor="start">SeaweedFS 4.50: 4 of 10 trials</text>
<text x="494" y="600" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#2563EB" font-weight="600" text-anchor="start">kept the previous ETag · old bytes stored</text>
<text x="40" y="654" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#64748B" font-weight="400" text-anchor="start">Measured 13 November 2026: SeaweedFS 4.50 and moto 5.2.5, boto3 1.44.2 — scripts/resume-probe.py, scripts/resume-overwrite-probe.py</text>
</svg>
