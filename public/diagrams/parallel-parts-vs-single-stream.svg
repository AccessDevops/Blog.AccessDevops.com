<text x="92" y="462" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="11" fill="#020817">One thread with parts is slower than no parts at all: 27 MiB/s against 59, because each of the 32 parts pays its own round trip.</text>
<text x="92" y="480" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="11" fill="#020817">Past four parts in flight the client burns 0.9 -> 1.4 CPU cores and throughput stops rising.</text>
<text x="92" y="498" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="10.5" fill="#64748B">whiskers: min-max across the 5 runs. Reproduce: python3 scripts/concurrency-probe.py run http://127.0.0.1:18333 bench --size-mib 256 --reps 5</text>
