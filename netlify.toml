[build]
  command = "npm run generate"
  publish = "dist"

# Ping IndexNow après chaque déploiement de production, une fois le site en
# ligne. Voir netlify/plugins/indexnow/index.js.
[[plugins]]
  package = "./netlify/plugins/indexnow"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--prefer-offline --no-audit --no-fund"
  NODE_OPTIONS = "--max-old-space-size=4096"

# Le proxy inverse PostHog est dans public/_redirects, pas ici : voir le
# commentaire de ce fichier. Netlify lit _redirects avant netlify.toml, et
# l'attrape-tout que Nitro y écrit interceptait ces chemins.

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_nuxt/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/rss.xml"
  [headers.values]
    Content-Type = "application/rss+xml; charset=utf-8"

[[headers]]
  for = "/og-image.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
