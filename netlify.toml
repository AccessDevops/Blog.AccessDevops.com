[build]
  command = "npm run generate"
  publish = "dist"

# Ping IndexNow après chaque déploiement de production, une fois le site en
# ligne. Voir netlify/plugins/indexnow/index.js.
[[plugins]]
  package = "./netlify/plugins/indexnow"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--prefer-offline --no-audit --no-fund"
  NODE_OPTIONS = "--max-old-space-size=4096"

# Proxy inverse PostHog. Doit précéder toute autre règle de redirection.
# Deux entrées : les assets statiques du SDK et l'API sont sur deux
# sous-domaines PostHog différents. force=true pour que la réécriture
# s'applique même si un fichier existe au même chemin.
[[redirects]]
  from = "/relay-Kp7W/static/*"
  to = "https://eu-assets.i.posthog.com/static/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/relay-Kp7W/*"
  to = "https://eu.i.posthog.com/:splat"
  status = 200
  force = true

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_nuxt/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/rss.xml"
  [headers.values]
    Content-Type = "application/rss+xml; charset=utf-8"

[[headers]]
  for = "/og-image.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
